services:
    backend:
        build:
            context: .
            dockerfile: Dockerfile.prod
        container_name: fillando-be
        restart: unless-stopped
        env_file: .env.prod
        ports:
            - '4000:4000'
        depends_on:
            mongo:
                condition: service_healthy
        networks:
            - fillando-net

networks:
    fillando-net:
