# Disposable MongoDB for integration tests (`yarn test:integration`).
# Deliberately separate from the shared dev database in `.env` so tests never
# touch real data. No auth, bound to localhost only.
#
#   docker compose -f docker-compose.test.yml up -d
#   yarn test:integration
#   docker compose -f docker-compose.test.yml down -v
services:
    mongo-test:
        image: mongo:7
        container_name: fillando-mongo-test
        ports:
            - '127.0.0.1:27018:27017'
        tmpfs:
            - /data/db
        healthcheck:
            test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
            interval: 5s
            timeout: 3s
            retries: 10
